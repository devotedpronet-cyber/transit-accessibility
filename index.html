<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lisbon Transit Accessibility Planner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }
    button { background: #0066cc; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; }
    button:hover { background: #0052a3; }
    .results { margin-top: 30px; }
    .stop { background: #f9f9f9; padding: 15px; margin-bottom: 12px; border-left: 3px solid #0066cc; border-radius: 2px; }
    .stop-name { font-weight: 600; color: #333; margin-bottom: 4px; }
    .stop-distance { color: #666; font-size: 13px; }
    .stop-lines { color: #0066cc; font-size: 13px; }
    .error { color: #d32f2f; background: #ffebee; padding: 12px; border-radius: 4px; margin-top: 20px; }
    .empty { color: #999; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lisbon Transit Accessibility</h1>
    <p class="subtitle">Find step-free accessible bus stops near you</p>

    <div class="input-group">
      <label>Your Location (Latitude)</label>
      <input type="number" id="latitude" placeholder="e.g., 38.7136" step="0.0001" value="38.7136">
    </div>

    <div class="input-group">
      <label>Your Location (Longitude)</label>
      <input type="number" id="longitude" placeholder="e.g., -9.1399" step="0.0001" value="-9.1399">
    </div>

    <button onclick="search()">Find Accessible Stops</button>

    <div id="results" class="results"></div>
  </div>

  <script type="module">
    import { findNearestStepFreeStops, formatResults } from "./app.js";

    window.search = function() {
      const lat = parseFloat(document.getElementById("latitude").value);
      const lon = parseFloat(document.getElementById("longitude").value);
      const resultsDiv = document.getElementById("results");

      try {
        const stops = findNearestStepFreeStops(lat, lon);
        if (stops.length === 0) {
          resultsDiv.innerHTML = '<div class="empty">No accessible stops found within 2km.</div>';
          return;
        }

        resultsDiv.innerHTML = stops
          .map((stop) => `
            <div class="stop">
              <div class="stop-name">${stop.name}</div>
              <div class="stop-distance">Distance: ${stop.distance.toFixed(2)} km</div>
              <div class="stop-lines">Lines: ${stop.line}</div>
            </div>
          `)
          .join("");
      } catch (error) {
        resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    };

    // Auto-search on load
    window.search();
  </script>
</body>
</html>
